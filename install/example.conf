# social board: example preset for install.sh
#
#   sudo ./install.sh --config board.conf          asks only for keys that are missing
#   sudo ./install.sh --config board.conf --yes    never asks: missing keys use the defaults shown
#
# One KEY=VALUE per line. Lines starting with # are comments, and so is " # ..." after an
# unquoted value. Put a value in quotes if it contains a #. The file is read as text, never
# run, and unknown keys are an error (to catch typos).

# Shown in the header and page titles (1-40 characters).            default: social board
SITE_NAME="blugold board"

# Database: native   Ubuntu's PostgreSQL package (recommended)
#           podman   PostgreSQL 17 in a podman container, started at boot by systemd
#           docker   PostgreSQL 17 in a Docker container (Docker is installed if missing)
#           external a PostgreSQL server you already run: set DB_URL      default: native
DB_MODE=native
# Only for DB_MODE=external. Its user must own the database.
DB_URL=                      # e.g. postgresql://board:secret@db.example.com:5432/social_board

# HTTPS: a domain name pointing at this server. Caddy is installed and gets a certificate
# automatically; ports 80 and 443 must be reachable. Names ending in .internal, .home.arpa, .lan, .test,
# .local or "localhost" get a local certificate instead (browsers will warn).
# Empty = plain HTTP.                                                     default: empty
PUBLIC_DOMAIN=

# Who can reach the board without HTTPS: lan (any computer on the network) or local
# (this server only). Ignored with PUBLIC_DOMAIN: then only Caddy can reach the board.  default: lan
LISTEN=lan
# Port the board listens on.                                             default: 8080
PORT=8080
# Add ufw firewall rules for the board (or for 80/443 with HTTPS). The installer never
# switches ufw on itself, so it can't lock you out of SSH.                default: yes
OPEN_FIREWALL=yes

# Shown before names, like u/ and r/ on Reddit: 1-8 letters, numbers or _. They must
# differ, and can't be p, img, static, comment, settings, admin, live or ads.
USER_PREFIX=u                # default: u
COMMUNITY_PREFIX=r           # default: r
# May people pick their own prefix?                                       default: no
CUSTOM_USER_PREFIX=no
CUSTOM_COMMUNITY_PREFIX=no
# Can anyone sign up?                                                     default: yes
OPEN_REGISTRATION=yes
# Who can create communities: anyone or admins.                           default: anyone
COMMUNITY_CREATION=anyone

# The first admin account. If it already exists, it's kept as is (password unchanged) and
# made an admin.                                                          default: admin
ADMIN_USER=admin
# Empty = generate a strong password and print it once at the end. If you set one here,
# keep this file private: chmod 600 board.conf
ADMIN_PASSWORD=

# Load a snapshot from another board (made with: board.py export FILE).   default: empty
IMPORT_SNAPSHOT=

# --- advanced (never asked) ---------------------------------------------------------------
# Where the code comes from: auto (the folder install.sh is in, if it's the repo; otherwise
# GitHub), local, or github.                                              default: auto
CODE_SOURCE=auto
REPO_URL=https://github.com/ReedGraf/social-board.git
GIT_REF=main
